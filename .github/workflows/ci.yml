name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Все команды выполняются в папке lab102
defaults:
  run:
    working-directory: task2/lab102

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Клонируем репозиторий
      - uses: actions/checkout@v4

      # Устанавливаем Node.js и кешируем зависимости
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json  # путь относительно working-directory

      # Устанавливаем зависимости
      - name: Install dependencies
        run: npm ci

      # Запускаем тесты
      - name: Run tests
        run: npm test -- --coverage

      # Загружаем отчёт о покрытии
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    needs: test   # билд запускается только если тесты прошли
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/